name: esp32 firmware ci (reusable)

# Reusable workflow. Lives in a central repo (e.g. oxeltech/ci-templates)
# and is called by individual projects. Each project passes its own target
# list and options, so one file serves the whole org.

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of esp32 fqbn targets, e.g. ["esp32","esp32s3"]'
        required: false
        type: string
        default: '["esp32"]'
      core_version:
        description: 'Pinned esp32:esp32 core version'
        required: false
        type: string
        default: '3.0.7'
      sketch_path:
        description: 'Path to the sketch/project root'
        required: false
        type: string
        default: '.'
      enforce_tidy:
        description: 'Fail the build on clang-tidy findings (set true once clean)'
        required: false
        type: boolean
        default: false
      run_unit_tests:
        description: 'Run the host unit-test job'
        required: false
        type: boolean
        default: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: check formatting
        working-directory: ${{ inputs.sketch_path }}
        run: |
          find . -regex '.*\.\(ino\|cpp\|hpp\|c\|h\)' \
            -not -path './build/*' \
            -exec clang-format --dry-run --Werror {} +

  static-analysis:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: setup arduino cli
        uses: arduino/setup-arduino-cli@v2

      - name: configure and install esp board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ inputs.core_version }}

      - name: generate compile database
        working-directory: ${{ inputs.sketch_path }}
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --only-compilation-database \
            --build-path ./build \
            .

      - name: run clang-tidy
        working-directory: ${{ inputs.sketch_path }}
        run: |
          set -o pipefail
          FILES=$(find . -regex '.*\.\(cpp\|c\)' -not -path './build/*')
          if [ "${{ inputs.enforce_tidy }}" = "true" ]; then
            echo "$FILES" | xargs clang-tidy -p ./build
          else
            echo "$FILES" | xargs clang-tidy -p ./build || true
          fi

  unit-test:
    if: ${{ inputs.run_unit_tests }}
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: run host unit tests
        working-directory: ${{ inputs.sketch_path }}
        run: |
          echo "running host-based unit tests"
          # placeholder: replace with your real runner, e.g.
          #   cd test && cmake -B build && cmake --build build && ctest --test-dir build --output-on-failure
          # tests must be hardware-independent (parsers, state machines, protocol logic)
          if [ -d test ]; then
            echo "test/ found but no runner wired yet — update this step"
          else
            echo "no test/ directory — placeholder passing"
          fi
          exit 0

  build:
    needs: [static-analysis, unit-test]
    # unit-test may be skipped; don't let that block the build.
    if: ${{ always() && needs.static-analysis.result == 'success' && (needs.unit-test.result == 'success' || needs.unit-test.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup arduino cli
        uses: arduino/setup-arduino-cli@v2

      - name: cache esp32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ inputs.core_version }}

      - name: configure and install esp board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ inputs.core_version }}

      - name: build firmware for ${{ matrix.target }}
        working-directory: ${{ inputs.sketch_path }}
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:${{ matrix.target }} \
            --warnings all \
            --build-property "compiler.c.extra_flags=-Werror -Wunused-function" \
            --build-property "compiler.cpp.extra_flags=-Werror -Wunused-function" \
            --output-dir ./build/${{ matrix.target }} \
            --verbose \
            .

      - name: upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: ${{ inputs.sketch_path }}/build/${{ matrix.target }}/*.bin
          retention-days: 30
